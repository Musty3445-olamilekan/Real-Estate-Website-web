  <section>
    <form class="form-box">
    <h3>Client Info</h3>
    <div class="row">
      <div class="field">
        <label>Your Name</label>
        <input type="text" placeholder="Enter your name">
      </div>
      <div class="field">
        <label>Your Email</label>
        <input type="email" placeholder="Email address">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Phone Number</label>
        <input type="text" placeholder="Enter phone number">
      </div>
      <div class="field">
        <label>State</label>
        <input type="text" placeholder="Enter state">
      </div>
    </div>

    <hr>

    <!-- PROPERTY INFO -->
    <h3>Property Info</h3>

    <div class="row">
      <div class="field">
        <label>Property Name</label>
        <input type="text" placeholder="Enter property name">
      </div>
      <div class="field">
        <label>Property Type</label>
        <select>
          <option>Property Type</option>
          <option>House</option>
          <option>Apartment</option>
          <option>Land</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Agency</label>
        <select>
          <option>Villa Estate Agency</option>
          <option>Prime Homes</option>
        </select>
      </div>
      <div class="field">
        <label>Agent Name</label>
        <select>
          <option>Select Agent</option>
          <option>Agent One</option>
          <option>Agent Two</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Price</label>
        <select>
          <option>Select price</option>
          <option>Below 50,000</option>
          <option>50,000 - 100,000</option>
          <option>Above 100,000</option>
        </select>
      </div>
      <div class="field">
        <label>Location</label>
        <select>
          <option>Location</option>
          <option>Ilorin</option>
          <option>Lagos</option>
          <option>Abuja</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Bedroom</label>
        <select>
          <option>Select rooms</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
        </select>
      </div>
      <div class="field">
        <label>Bathrooms</label>
        <select>
          <option>Select rooms</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
        </select>
      </div>
    </div>

    <hr>

    <h3>Amenities</h3>
    <div class="amenities">
      <label><input type="checkbox"> Free Wi-Fi</label>
      <label><input type="checkbox"> 24/7 Security</label>
      <label><input type="checkbox"> Retail Shop</label>
      <label><input type="checkbox"> Child Hubs</label>
      <label><input type="checkbox"> Fitness Center</label>
      <label><input type="checkbox"> School</label>
      <label><input type="checkbox"> Spa</label>
      <label><input type="checkbox"> Swimming Pool</label>
    </div>

    <hr>

    <!-- DESCRIPTION -->
    <div class="field">
      <label>Description</label>
      <textarea placeholder="Add short description"></textarea>
    </div>

  </form>
